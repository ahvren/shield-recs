<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#07080c">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>News</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#07080c;--card:#12151d;--line:rgba(255,255,255,.10);--txt:#eef1f6;--dim:#9aa3b2;--accent:#7fd4ff;--good:#7ee2a8;--bad:#ff8a8a;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 Roboto,"Segoe UI",system-ui,sans-serif;overscroll-behavior-y:contain}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:10;background:rgba(7,8,12,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(var(--safe-t) + 10px) 14px 0;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:4px;flex:1}
.tab{border:0;background:none;padding:6px 10px;font-size:20px;font-weight:700;color:var(--dim);border-radius:10px}
.tab[aria-selected=true]{color:var(--txt)}
.icon{border:1px solid rgba(255,255,255,.16);background:transparent;color:#fff;border-radius:999px;height:38px;min-width:38px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
.icon.on{background:#fff;color:#0b0d12;border-color:#fff;font-weight:700}
.icon svg{width:18px;height:18px}
.spin svg{animation:sp 0.9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:7px 13px;font-size:14px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--txt);color:#0b0d12;border-color:var(--txt);font-weight:600}
.chip .n{opacity:.6;margin-left:4px;font-size:12px}
#status{font-size:12.5px;color:var(--dim);padding:8px 16px 0}
#status.warn{color:#ffd27f}
#ptr{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px;transition:height .2s}
main{padding:8px 12px calc(96px + var(--safe-b));max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin:12px 0;content-visibility:auto;contain-intrinsic-size:auto 420px}
.card a.hit{display:block;color:inherit;text-decoration:none}
.media{aspect-ratio:16/9;background:linear-gradient(135deg,var(--c1,#1d3b6b),var(--c2,#311d4f));position:relative;display:flex;align-items:flex-end}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media .ph{padding:14px;font-weight:700;font-size:18px;opacity:.9}
.body{padding:12px 16px 4px}
.meta{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--dim);flex-wrap:wrap}
.meta .tp{color:var(--accent)}
.meta .badge{color:#fff;font-weight:600}
h2{font-size:19px;line-height:1.3;margin:6px 0 6px;font-weight:600}
.sum{color:#c6ccd6;font-size:15px;margin:0 0 8px}
.acts{display:flex;gap:10px;padding:4px 14px 14px;justify-content:space-between;max-width:330px}
.acts::-webkit-scrollbar{display:none}
.act{flex:0 0 auto;width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;border:0;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:999px;color:#fff;padding:0}
.act .ic{width:20px;height:20px;stroke-width:2.4}
.ic.solid{fill:currentColor;stroke-width:1.2}
.act:active{transform:scale(.94);background:rgba(255,255,255,.28)}
.act.done{background:#fff;color:#0b0d12}
.ic{width:20px;height:20px;display:block}
.ic.sm{width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:3px}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin:6px 0}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--txt)}
.legend .ic{width:18px;height:18px}
.card.gone{display:none}
.empty{color:var(--dim);text-align:center;padding:60px 20px}
/* Watch tab */
.sec{font-size:15px;font-weight:700;color:var(--dim);margin:18px 4px 6px;text-transform:uppercase;letter-spacing:.06em}
.w{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;margin:10px 0;color:inherit;text-decoration:none}
.w img{width:92px;height:138px;object-fit:cover;border-radius:12px;background:#1a1d26;flex:0 0 auto}
.w h3{margin:2px 0 4px;font-size:17px}
.w .why{font-size:14px;color:#c6ccd6;margin:6px 0}
.svc{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;margin:2px 4px 0 0;color:#fff;text-decoration:none}
/* toast, batch bar, sheet */
#toast{position:fixed;left:12px;right:12px;bottom:calc(16px + var(--safe-b));z-index:30;background:#202634;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:none;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:560px;margin:0 auto}
#toast span{flex:1;font-size:14px}
#toast button{border:0;background:none;color:#fff;font-weight:700;padding:4px 6px;display:inline-flex;align-items:center;gap:2px}
#batchbar{position:fixed;left:12px;right:12px;bottom:calc(16px + var(--safe-b));z-index:25;display:none;gap:8px;max-width:560px;margin:0 auto}
#batchbar button{flex:1;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:15px}
#sendBatch{background:var(--accent);color:#06121a}
#clearBatch{flex:0 0 auto!important;background:#202634;color:var(--txt)}
body.toasting #batchbar{bottom:calc(84px + var(--safe-b))}
#sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:none;align-items:flex-end}
#sheet .pane{background:#141821;border-top-left-radius:22px;border-top-right-radius:22px;width:100%;max-height:85vh;overflow:auto;padding:18px 16px calc(24px + var(--safe-b));border-top:1px solid var(--line)}
#sheet h4{margin:16px 0 8px;font-size:14px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.row span{flex:1}
.row button,.big{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:10px;padding:7px 12px;font-size:14px}
.big{width:100%;margin-top:10px;padding:12px}
.note{font-size:13px;color:var(--dim)}

/* ---------- responsive (added; phone portrait <600px is untouched) ---------- */
#rail{display:none}
main[hidden]{display:none!important}
.railsend{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:12px;padding:11px 14px;margin:0 0 14px;background:var(--accent);color:#06121a;font-size:14.5px;text-align:left;cursor:pointer}
.railsend[hidden]{display:none}
.railsend .ic{width:18px;height:18px}
.railsend:hover{filter:brightness(1.08)}
@media (min-width:1100px){body:not(.watching) #batchbar{display:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card a.hit:focus-visible{outline-offset:-3px;border-radius:20px 20px 0 0}
@media (hover:hover) and (pointer:fine){
  .card{transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
  .card:hover{border-color:rgba(255,255,255,.24);transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.5)}
  .card a.hit:hover h2{color:#fff;text-decoration:underline;text-decoration-color:rgba(255,255,255,.35);text-underline-offset:3px}
  .act{cursor:pointer;transition:background .12s ease,transform .12s ease}
  .act:hover{background:rgba(255,255,255,.28)}
  .act.done:hover{background:#fff}
  .chip,.tab,.icon,.row button,.big{cursor:pointer}
  .chip:hover{background:rgba(255,255,255,.11)}
  .chip[aria-pressed=true]:hover{background:var(--txt)}
  .tab:hover{color:var(--txt)}
  .icon:hover{background:rgba(255,255,255,.09)}
  .icon.on:hover{background:#fff}
  .w{transition:border-color .15s ease,background .15s ease}
  .w:hover{border-color:rgba(255,255,255,.24);background:#161a24}
  .row button:hover,.big:hover{background:rgba(255,255,255,.12)}
}
@media (min-width:600px){
  header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:calc(var(--safe-t) + 8px) max(16px,calc((100% - 1440px)/2 + 16px)) 8px}
  .bar{display:contents}
  .tabs{flex:0 0 auto;order:0}
  .chips{order:1;flex:1 1 0;min-width:0;padding:2px 0;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
  .bar>.icon{order:2}
  #status{padding:10px 16px 0}
  main{max-width:none;padding:12px 16px calc(96px + var(--safe-b))}
  #feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:stretch}
  #feed>.empty{grid-column:1/-1}
  .card{margin:0;display:flex;flex-direction:column;contain-intrinsic-size:auto 440px}
  .card a.hit{flex:1 1 auto}
  .card h2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;font-size:18px}
  .card .sum{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;font-size:14.5px}
  .acts{gap:8px}
  #watch{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;align-content:start}
  #watch>.sec,#watch>.note,#watch>.empty{grid-column:1/-1}
  #watch>.sec{margin:14px 4px 0}
  .w{margin:0}
  .w .why{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
  #toast,#batchbar{left:16px;right:16px}
  #sheet{align-items:center;justify-content:center;padding:24px}
  #sheet .pane{max-width:560px;border-radius:22px;border:1px solid var(--line);max-height:min(86vh,780px);padding:20px 20px 24px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
}
/* phones in landscape / short windows: keep the action row on screen */
@media (orientation:landscape) and (max-height:520px){
  header{padding-top:calc(var(--safe-t) + 6px);padding-bottom:6px}
  .tab{font-size:18px;padding:4px 8px}
  .icon{height:34px;min-width:34px}
  .chip{padding:5px 11px;font-size:13.5px}
  #status{padding-top:6px}
  main{padding-top:8px}
  .media{aspect-ratio:auto;height:clamp(92px,30vh,140px)}
  .card{contain-intrinsic-size:auto 340px}
  .card h2{-webkit-line-clamp:2;font-size:17px;margin:4px 0}
  .card .sum{-webkit-line-clamp:2;margin-bottom:4px}
  .body{padding:10px 14px 2px}
  .acts{padding:4px 12px 10px}
  .act{width:38px;height:38px}
  #sheet .pane{max-height:92vh}
  #batchbar button{padding:10px}
  #toast{padding:9px 14px}
  body.toasting #batchbar{bottom:calc(70px + var(--safe-b))}
}
/* desktop: centered layout with a sticky topic rail */
@media (min-width:1100px){
  .tabs{flex:1 1 auto}
  .layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;max-width:1440px;margin:0 auto;padding:0 16px}
  body.watching .layout{grid-template-columns:minmax(0,1fr)}
  body.watching #rail{display:none}
  #rail{display:block;position:sticky;top:calc(var(--hdr,58px) + 16px);align-self:start;margin-top:16px;max-height:calc(100vh - var(--hdr,58px) - 32px);overflow:auto;scrollbar-width:thin}
  .railh{font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;padding:4px 14px 8px}
  #rail .chips{flex-direction:column;overflow:visible;padding:0;gap:2px;-webkit-mask-image:none;mask-image:none}
  #rail .chip{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;border-radius:12px;padding:10px 14px;font-size:15px;border-color:transparent;background:transparent}
  #rail .chip .n{margin-left:10px;font-size:12.5px;opacity:.65}
  #rail .chip[aria-pressed=true]{background:rgba(255,255,255,.12);color:var(--txt);border-color:rgba(255,255,255,.14);font-weight:600}
  .col{min-width:0}
  #status{padding:16px 2px 0}
  main{padding:12px 0 calc(96px + var(--safe-b))}
  #feed{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
  #sheet{justify-content:flex-end;align-items:stretch;padding:0}
  #sheet .pane{max-width:440px;width:440px;max-height:none;height:100%;border-radius:0;border:0;border-left:1px solid var(--line);padding:24px 24px 32px}
}
@media (hover:hover) and (pointer:fine) and (min-width:1100px){
  #rail .chip:hover{background:rgba(255,255,255,.07)}
  #rail .chip[aria-pressed=true]:hover{background:rgba(255,255,255,.14)}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabNews" aria-selected="true">News</button>
      <button class="tab" role="tab" id="tabWatch" aria-selected="false">Watch</button>
    </div>
    <button class="icon" id="batchBtn" title="Batch mode: queue feedback and send it in one issue" aria-label="Batch mode" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg><span id="batchTxt">Batch</span></button>
    <button class="icon" id="refresh" aria-label="Refresh" title="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    <button class="icon" id="menu" aria-label="Feed settings" title="Feed settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg></button>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="layout"><aside id="rail" aria-label="Topics"><button id="railSend" class="railsend" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg><b>Send 0 in one issue</b></button><div class="railh">Topics</div></aside><div class="col">
<div id="ptr">Pull to refresh</div>
<div id="status"></div>
<main id="feed"><div class="empty">Loading…</div></main>
<main id="watch" hidden></main>
</div></div>
<div id="batchbar"><button id="sendBatch">Send 0 actions</button><button id="clearBatch">Clear</button></div>
<div id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo" aria-label="Undo last action"><svg class="ic sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Undo</button></div>
<div id="sheet"><div class="pane" id="pane"></div></div>
<script>
'use strict';
const REPO = 'ahvren/shield-recs';
const NEWS_URL = '../news.json', RECS_URL = '../recs.json';
const MAX_URL = 7600;                       // keep issue URLs comfortably under GitHub's limit
const SHORT = {homelab:'Homelab', gaming:'Gaming', aviation:'Aviation', streaming:'Streaming', ai:'AI & dev', local:'Local'};
const HUE = {homelab:['#14476b','#1e2f55'], gaming:['#4a2a6b','#1f1a40'], aviation:['#1d4f6b','#18304a'], streaming:['#5a1f3a','#24152f'], ai:['#1f5a4a','#15302c'], local:['#6b4a1d','#3a2416']};
// Plain monochrome line icons (stroke = currentColor, rendered white). No emoji anywhere in the UI.
const svg = (d, cls = 'ic') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${d}</svg>`;
const ICON = {
  up: '<path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/>',
  down: '<path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/>',
  more_like_this: '<path d="M12 5v14"/><path d="M5 12h14"/>',
  hide_topic: '<path d="M10.73 5.08A10.74 10.74 0 0 1 21.94 11.65a1 1 0 0 1 0 .7 10.75 10.75 0 0 1-1.44 2.49"/><path d="M14.08 14.16a3 3 0 0 1-4.24-4.24"/><path d="M17.48 17.5a10.75 10.75 0 0 1-15.42-5.15 1 1 0 0 1 0-.7 10.75 10.75 0 0 1 4.45-5.14"/><path d="m2 2 20 20"/>',
  hide_source: '<circle cx="12" cy="12" r="8.5"/><path d="m6 6 12 12"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  layers: '<path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/>',
};
const icCls = a => (a === 'up' || a === 'down') ? 'ic solid' : 'ic';
const ACTIONS = [  // [action, accessible label, short legend label]
  ['up', 'Thumbs up', 'Up'], ['down', 'Thumbs down: hide this story', 'Down'], ['more_like_this', 'More like this', 'More like this'],
  ['hide_topic', 'Hide this topic', 'Hide topic'], ['hide_source', 'Hide this source', 'Hide source']];
// cards appended per batch (incremental rendering for 150+ items); bigger on grid layouts so the viewport fills
const pageSize = () => innerWidth < 600 ? 20 : innerWidth < 1100 ? 24 : 36;
let LIST = [], shown = 0, io = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- local state ----------
const LS = 'shieldnews.v1';
const S = Object.assign({hiddenItems:{}, hiddenTopics:{}, hiddenSources:{}, marks:{}, topicBoost:{}, sourceBoost:{},
  queue:[], sent:[], batch:false, batchBig:true, filter:'all', tab:'news'}, JSON.parse(localStorage.getItem(LS) || '{}'));
const save = () => localStorage.setItem(LS, JSON.stringify(S));
// Tablet/desktop (>=600px wide or a mouse) default to batch mode so taps don't open a GitHub tab each;
// phone portrait keeps its own setting (off by default). Each layout remembers its own toggle.
const mqBig = matchMedia('(min-width:600px), (pointer:fine)');
const bigUI = () => mqBig.matches;
const batchOn = () => bigUI() ? S.batchBig !== false : !!S.batch;
const setBatch = v => { if (bigUI()) S.batchBig = v; else S.batch = v; };
let NEWS = null, RECS = null;

function uuid(){ return crypto.randomUUID ? crypto.randomUUID() :
  'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = crypto.getRandomValues(new Uint8Array(1))[0] & 15; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }); }
const isoNow = () => new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
function ago(iso){
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (!isFinite(s)) return '';
  if (s < 3600) return Math.max(1, Math.round(s/60)) + 'm ago';
  if (s < 86400) return Math.round(s/3600) + 'h ago';
  const d = Math.round(s/86400); return d < 14 ? d + 'd ago' : new Date(iso).toLocaleDateString();
}

// ---------- data ----------
async function getJSON(url){
  const res = await fetch(url + '?t=' + Date.now(), {cache:'no-store'});
  if (!res.ok) throw new Error(url + ' ' + res.status);
  return {data: await res.json(), cached: res.headers.get('X-From-Cache') === '1'};
}
async function load(manual){
  $('#refresh').classList.add('spin');
  try {
    const n = await getJSON(NEWS_URL); NEWS = n.data;
    localStorage.setItem(LS + '.news', JSON.stringify(NEWS));
    setStatus(n.cached ? 'Offline: showing saved feed from ' + ago(NEWS.generated) : 'Updated ' + ago(NEWS.generated) + ' · ' + NEWS.items.length + ' stories', n.cached);
  } catch (e) {
    const c = localStorage.getItem(LS + '.news');
    if (c) { NEWS = JSON.parse(c); setStatus('Offline: showing saved feed from ' + ago(NEWS.generated), true); }
    else setStatus('Could not load news.json (' + e.message + ')', true);
  }
  getJSON(RECS_URL).then(r => { RECS = r.data; if (S.tab === 'watch') renderWatch(); }).catch(() => {});
  $('#refresh').classList.remove('spin');
  render();
  if (manual) window.scrollTo({top:0, behavior:'smooth'});
}
function setStatus(t, warn){ const el = $('#status'); el.textContent = t; el.className = warn ? 'warn' : ''; }

// ---------- ranking ----------
function visible(){
  if (!NEWS) return [];
  return NEWS.items.filter(i => !S.hiddenItems[i.id] && !S.hiddenTopics[i.topic] && !S.hiddenSources[i.source])
    .map(i => ({i, s: (i.score || 0) + (S.topicBoost[i.topic] || 0) + (S.sourceBoost[i.source] || 0)}))
    .sort((a, b) => b.s - a.s).map(x => x.i);
}

// ---------- render ----------
function renderChips(items){
  const el = $('#chips');
  if (S.tab === 'watch') { el.innerHTML = ''; el.style.display = 'none'; return; }
  el.style.display = '';
  const topics = (NEWS?.topics || []).filter(t => !S.hiddenTopics[t.id]);
  const count = id => items.filter(i => i.topic === id).length;
  if (S.filter !== 'all' && !topics.some(t => t.id === S.filter)) S.filter = 'all';
  el.innerHTML = `<button class="chip" data-f="all" aria-pressed="${S.filter === 'all'}">For you<span class="n">${items.length}</span></button>` +
    topics.map(t => `<button class="chip" data-f="${esc(t.id)}" aria-pressed="${S.filter === t.id}">${esc(SHORT[t.id] || t.label)}<span class="n">${count(t.id)}</span></button>`).join('');
}
function card(i){
  const [c1, c2] = HUE[i.topic] || ['#1d3b6b','#311d4f'];
  const mark = S.marks[i.id];
  const topicLabel = SHORT[i.topic] || (NEWS.topics.find(t => t.id === i.topic) || {}).label || i.topic;
  return `<article class="card" data-id="${esc(i.id)}">
    <a class="hit" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">
      <div class="media" style="--c1:${c1};--c2:${c2}">
        <div class="ph">${esc(i.source)}</div>
        ${i.image ? `<img src="${esc(i.image)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}
      </div>
      <div class="body">
        <div class="meta"><span class="tp">${esc(topicLabel)}</span>·<span>${esc(i.source)}</span>·<span>${ago(i.published)}</span>${mark ? `<span class="badge">${svg(ICON.check, 'ic sm')}${mark === 'up' ? 'Liked' : 'More like this'}</span>` : ''}</div>
        <h2>${esc(i.title)}</h2>
        <p class="sum">${esc(i.summary)}</p>
      </div>
    </a>
    <div class="acts" role="group" aria-label="Feedback">${ACTIONS.map(([a, l]) => `<button class="act${mark === a ? ' done' : ''}" data-a="${a}" aria-label="${l}" title="${l}" aria-pressed="${mark === a}">${svg(ICON[a], icCls(a))}</button>`).join('')}</div>
  </article>`;
}
function render(keep){
  const items = visible();
  renderChips(items);
  renderBatchBar();
  if (S.tab === 'watch') return renderWatch();
  LIST = S.filter === 'all' ? items : items.filter(i => i.topic === S.filter);
  const want = keep ? Math.max(pageSize(), shown) : pageSize();
  shown = 0;
  $('#feed').innerHTML = LIST.length ? '' :
    `<div class="empty">${NEWS ? 'Nothing left here. Check hidden items in the menu (top right) or refresh.' : 'No feed yet.'}</div>`;
  appendMore(want);
}
function appendMore(n = pageSize()){
  const feed = $('#feed'), old = $('#more'); if (old) old.remove();
  const next = LIST.slice(shown, shown + n); shown += next.length;
  if (next.length) feed.insertAdjacentHTML('beforeend', next.map(card).join(''));
  if (shown < LIST.length) {
    feed.insertAdjacentHTML('beforeend', `<div id="more" class="empty" style="padding:24px">Loading more…</div>`);
    io = io || new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) appendMore(); }, {rootMargin: '1500px 0px'});
    io.disconnect(); io.observe($('#more'));
  } else if (LIST.length) feed.insertAdjacentHTML('beforeend', `<div id="more" class="empty" style="padding:24px">You're all caught up · ${LIST.length} stories</div>`);
}
// apply an action to the cards already on screen without re-rendering (keeps scroll position)
function patchDom(item, action){
  const cards = [...document.querySelectorAll('#feed .card')];
  const gone = c => { const it = NEWS.items.find(i => i.id === c.dataset.id); return it && (S.hiddenItems[it.id] || S.hiddenTopics[it.topic] || S.hiddenSources[it.source]); };
  if (action === 'down' || action === 'hide_topic' || action === 'hide_source') {
    cards.forEach(c => { if (gone(c)) c.remove(); });
    LIST = LIST.filter(i => !(S.hiddenItems[i.id] || S.hiddenTopics[i.topic] || S.hiddenSources[i.source]));
    shown = Math.min(shown, document.querySelectorAll('#feed .card').length);
    if (!LIST.length) render(); else if (shown < LIST.length && !$('#more')) appendMore(0);
  } else {
    const c = cards.find(c => c.dataset.id === item.id); if (c) c.outerHTML = card(item);
  }
  renderChips(visible()); renderBatchBar();
}
function renderWatch(){
  const el = $('#watch');
  if (!RECS) { el.innerHTML = '<div class="empty">Loading recommendations…</div>'; return; }
  const svc = RECS.services || {};
  const rows = (RECS.rows || []).concat(RECS.anime ? [RECS.anime] : []);
  el.innerHTML = rows.map(r => `<div class="sec">${esc(r.label)}</div>` + r.items.map(t => {
    const links = Object.entries(t.links || {});
    const first = links[0] ? links[0][1] : (t.justwatch || '#');
    return `<a class="w" href="${esc(first)}" target="_blank" rel="noopener noreferrer">
      <img src="../${esc(t.poster)}" alt="" loading="lazy">
      <div><h3>${esc(t.title)}</h3><div class="meta">${esc(t.year || '')} · ${t.type === 'movie' ? 'Movie' : 'Series'}</div>
      <div class="why">${esc(t.why || '')}</div>
      <div>${(t.services || []).map(s => `<span class="svc" style="background:${esc((svc[s] || {}).color || '#444')}">${esc(s)}</span>`).join('')}</div></div></a>`;
  }).join('')).join('') + `<p class="note" style="text-align:center;margin:20px">Availability: ${esc(RECS.availability_source || 'JustWatch')} · updated ${ago(RECS.generated)}</p>`;
}

// ---------- feedback ----------
function issueURL(events){
  const one = events.length === 1;
  const e0 = events[0];
  const title = one ? `news-feedback: ${e0.action} — ${e0.title}`.slice(0, 200) : `news-feedback: batch — ${events.length} actions`;
  const json = JSON.stringify(one ? e0 : events, null, one ? 2 : 1);
  const body = 'Sent from the /m/ news page. Tap **Submit new issue**; the recommender reads the JSON below.\n\n```json\n' + json + '\n```\n';
  return `https://github.com/${REPO}/issues/new?labels=news-feedback&title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
}
function makeEvent(item, action){
  return {id: uuid(), ts: isoNow(), item_id: item.id, topic: item.topic, source: item.source, title: item.title, action};
}
function applyLocal(item, action){
  const undo = JSON.stringify(S);   // snapshot for undo (small)
  const bump = (o, k, v) => { o[k] = Math.round(((o[k] || 0) + v) * 1000) / 1000; };
  if (action === 'up') { S.marks[item.id] = 'up'; bump(S.topicBoost, item.topic, .08); bump(S.sourceBoost, item.source, .05); }
  if (action === 'more_like_this') { S.marks[item.id] = 'more_like_this'; bump(S.topicBoost, item.topic, .15); bump(S.sourceBoost, item.source, .1); }
  if (action === 'down') { S.hiddenItems[item.id] = Date.now(); bump(S.sourceBoost, item.source, -.04); }
  if (action === 'hide_topic') S.hiddenTopics[item.topic] = Date.now();
  if (action === 'hide_source') S.hiddenSources[item.source] = Date.now();
  return undo;
}
function act(id, action){
  const item = NEWS.items.find(i => i.id === id); if (!item) return;
  const before = applyLocal(item, action);
  const ev = makeEvent(item, action);
  let msg = {up:'Liked', down:'Fewer like this', more_like_this:'More like this', hide_topic:'Hid topic: ' + (SHORT[item.topic] || item.topic), hide_source:'Hid source: ' + item.source}[action];
  if (batchOn()) { S.queue.push(ev); msg += ' · queued (' + S.queue.length + ')'; }
  else { S.sent.push({id: ev.id, ts: ev.ts, n: 1}); window.open(issueURL([ev]), '_blank', 'noopener'); msg += ' · opened issue'; }
  save(); patchDom(item, action);
  toast(msg, () => {
    const q = S.queue, sent = S.sent; Object.assign(S, JSON.parse(before));
    S.queue = q.filter(e => e.id !== ev.id); S.sent = sent; save(); render(true);
    if (!batchOn()) toast('Undone locally. Close the GitHub tab without submitting.');
  });
}
function sendBatch(){
  if (!S.queue.length) return;
  // take as many queued events as fit in one URL; the rest stay queued
  let n = S.queue.length;
  while (n > 1 && issueURL(S.queue.slice(0, n)).length > MAX_URL) n--;
  const evs = S.queue.slice(0, n);
  window.open(issueURL(evs), '_blank', 'noopener');
  S.sent.push({id: evs[0].id, ts: isoNow(), n}); S.queue = S.queue.slice(n); save(); renderBatchBar();
  toast(S.queue.length ? `Opened issue with ${n}; ${S.queue.length} still queued` : `Opened issue with ${n} action${n > 1 ? 's' : ''}`);
}
function renderBatchBar(){
  const show = S.queue.length > 0;   // queued items always keep the Send bar visible
  $('#batchbar').style.display = show ? 'flex' : 'none';
  $('#sendBatch').textContent = `Send ${S.queue.length} action${S.queue.length === 1 ? '' : 's'} in one issue`;
  const on = batchOn();
  $('#batchBtn').classList.toggle('on', on); $('#batchBtn').setAttribute('aria-pressed', on);
  $('#batchTxt').textContent = on && S.queue.length ? 'Batch ' + S.queue.length : 'Batch';
  const rs = $('#railSend'); if (rs) { rs.hidden = !S.queue.length; rs.querySelector('b').textContent = `Send ${S.queue.length} in one issue`; }
}
let toastTimer;
const UNDO_HTML = $('#toastUndo').innerHTML;
function toast(msg, undo, label){
  $('#toastMsg').textContent = msg; $('#toastUndo').style.display = undo ? '' : 'none';
  $('#toastUndo').innerHTML = label ? esc(label) : UNDO_HTML; $('#toastUndo').setAttribute('aria-label', label || 'Undo last action');
  $('#toastUndo').onclick = () => { hideToast(); undo && undo(); };
  $('#toast').style.display = 'flex'; document.body.classList.add('toasting');
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 5000);
}
function hideToast(){ $('#toast').style.display = 'none'; document.body.classList.remove('toasting'); }

// ---------- settings sheet ----------
function openSheet(){
  const rows = (obj, kind) => Object.keys(obj).map(k => `<div class="row"><span>${esc(kind === 'item' ? ((NEWS?.items.find(i => i.id === k) || {}).title || k) : (SHORT[k] || k))}</span><button data-un="${kind}" data-k="${esc(k)}">Show</button></div>`).join('') || '<p class="note">None</p>';
  $('#pane').innerHTML = `<b style="font-size:18px">Feed settings</b>
    <h4>Hidden topics</h4>${rows(S.hiddenTopics, 'topic')}
    <h4>Hidden sources</h4>${rows(S.hiddenSources, 'source')}
    <h4>Hidden stories</h4>${rows(S.hiddenItems, 'item')}
    <h4>Feedback buttons</h4>
    <div class="legend">${ACTIONS.map(([a, , l]) => `<span>${svg(ICON[a], icCls(a))}${l}</span>`).join('')}</div>
    <h4>Feedback</h4>
    <p class="note">Each action opens a prefilled GitHub issue on ${REPO} with the label <b>news-feedback</b>; tap Submit. Batch mode queues actions and sends them in one issue. You need to be signed in to GitHub in this browser.</p>
    <p class="note">Queued: ${S.queue.length} · issues opened from this phone: ${S.sent.length}</p>
    <button class="big" id="resetLocal">Reset local tweaks (hides, boosts, queue)</button>
    <button class="big" id="closeSheet">Close</button>`;
  $('#sheet').style.display = 'flex';
}
$('#sheet').addEventListener('click', e => {
  const t = e.target;
  if (t === $('#sheet') || t.id === 'closeSheet') { $('#sheet').style.display = 'none'; return; }
  if (t.dataset.un) { const m = {topic:'hiddenTopics', source:'hiddenSources', item:'hiddenItems'}[t.dataset.un]; delete S[m][t.dataset.k]; save(); render(); openSheet(); }
  if (t.id === 'resetLocal' && confirm('Reset all local hides, boosts and the batch queue?')) {
    Object.assign(S, {hiddenItems:{}, hiddenTopics:{}, hiddenSources:{}, marks:{}, topicBoost:{}, sourceBoost:{}, queue:[]}); save(); render(); openSheet(); }
});

// ---------- events ----------
$('#feed').addEventListener('click', e => { const b = e.target.closest('.act'); if (!b) return; e.preventDefault(); act(b.closest('.card').dataset.id, b.dataset.a); });
$('#chips').addEventListener('click', e => { const c = e.target.closest('.chip'); if (!c) return; S.filter = c.dataset.f; save(); render(); window.scrollTo({top:0}); });
$('#refresh').onclick = () => load(true);
$('#menu').onclick = openSheet;
$('#batchBtn').onclick = () => { setBatch(!batchOn()); save(); renderBatchBar(); toast(batchOn() ? 'Batch on: actions queue until you tap Send' : (S.queue.length ? `Batch off: ${S.queue.length} still queued` : 'Batch off: each action opens an issue')); };
(mqBig.addEventListener ? mqBig.addEventListener('change', () => renderBatchBar()) : mqBig.addListener(() => renderBatchBar()));
$('#sendBatch').onclick = sendBatch; $('#railSend').onclick = sendBatch;
$('#clearBatch').onclick = () => { if (confirm('Drop ' + S.queue.length + ' queued action(s)? Local hides stay.')) { S.queue = []; save(); renderBatchBar(); } };
function setTab(t){ S.tab = t; save(); document.body.classList.toggle('watching', t === 'watch'); $('#tabNews').setAttribute('aria-selected', t === 'news'); $('#tabWatch').setAttribute('aria-selected', t === 'watch');
  $('#feed').hidden = t !== 'news'; $('#watch').hidden = t !== 'watch'; render(); window.scrollTo({top:0}); }
$('#tabNews').onclick = () => setTab('news'); $('#tabWatch').onclick = () => setTab('watch');

// pull-to-refresh (works in the installed PWA where Chrome's own gesture is off)
let y0 = null, pulled = 0;
addEventListener('touchstart', e => { y0 = scrollY <= 0 ? e.touches[0].clientY : null; }, {passive:true});
addEventListener('touchmove', e => { if (y0 === null) return; pulled = Math.max(0, e.touches[0].clientY - y0);
  const h = Math.min(70, pulled / 2); $('#ptr').style.transition = 'none'; $('#ptr').style.height = h + 'px';
  $('#ptr').textContent = pulled > 120 ? 'Release to refresh' : 'Pull to refresh'; }, {passive:true});
addEventListener('touchend', () => { $('#ptr').style.transition = ''; $('#ptr').style.height = '0';
  if (y0 !== null && pulled > 120) load(true); y0 = null; pulled = 0; });
document.addEventListener('visibilitychange', () => { if (!document.hidden && NEWS && Date.now() - Date.parse(NEWS.generated) > 30 * 60e3) load(); });

// prune local hides for stories older than 14 days
const cutoff = Date.now() - 14 * 864e5;
for (const k in S.hiddenItems) if (S.hiddenItems[k] < cutoff) delete S.hiddenItems[k];
S.sent = S.sent.slice(-200); save();

// ---------- responsive helpers ----------
// desktop: move the topic chips into the sticky left rail; smaller screens keep them in the header strip
const mqDesk = matchMedia('(min-width:1100px)');
function placeChips(){ const c = $('#chips'), want = mqDesk.matches ? $('#rail') : $('header'); if (c.parentNode !== want) want.appendChild(c); }
(mqDesk.addEventListener ? mqDesk.addEventListener('change', placeChips) : mqDesk.addListener(placeChips)); placeChips();
// header height for the rail's sticky offset
const setHdr = () => document.documentElement.style.setProperty('--hdr', $('header').offsetHeight + 'px');
if ('ResizeObserver' in window) new ResizeObserver(setHdr).observe($('header')); setHdr();
// mouse wheel scrolls the horizontal chip strip
$('#chips').addEventListener('wheel', e => { const c = e.currentTarget;
  if (c.parentNode.id === 'rail' || c.scrollWidth <= c.clientWidth || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
  c.scrollLeft += e.deltaY; e.preventDefault(); }, {passive:false});
// Esc closes the settings sheet
addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet').style.display === 'flex') $('#sheet').style.display = 'none'; });
// growing the window past one batch: fill the grid so infinite scroll can trigger
let rzT; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (S.tab === 'news' && shown < LIST.length && shown < pageSize()) appendMore(pageSize() - shown); }, 200); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
setTab(S.tab === 'watch' ? 'watch' : 'news');
load();
if (S.queue.length) setTimeout(() => toast(`${S.queue.length} feedback action${S.queue.length === 1 ? '' : 's'} still queued from last time`, sendBatch, 'Send'), 900);
</script>
</body>
</html>
